site_name: Datalook Studio
site_description: Self-hosted, browser-based database management dashboard for teams.
site_url: https://docs.datalook.dev
repo_url: https://github.com/datalook/studio
repo_name: datalook/studio
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - Connections: guides/connections.md
      - SQL Editor: guides/sql-editor.md
      - Data Export: guides/data-export.md
      - Roles & Permissions: guides/roles.md
      - YAML Config: guides/yaml-config.md
      - Theme Customization: guides/theming.md
  - Deployment:
      - Docker: deployment/docker.md
      - Vercel: deployment/vercel.md
      - Standalone: deployment/standalone.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datalook/studio
