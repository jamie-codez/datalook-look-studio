site_name: Datalook Studio
site_description: Self-hosted database management dashboard for teams
# Output goes to <repo-root>/site (mkdocs's own default) — it can't live
# inside docs_dir ("docs"), since mkdocs refuses to nest the build output
# inside its own source directory. docs/wrangler.toml points at "../site"
# to match (see its comment).

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - Connections: guides/connections.md
      - SQL Editor: guides/sql-editor.md
      - Roles: guides/roles.md
      - Data Export: guides/data-export.md
      - Theming: guides/theming.md
      - YAML Config: guides/yaml-config.md
  - Deployment:
      - Docker: deployment/docker.md
      - Standalone: deployment/standalone.md
      - Vercel: deployment/vercel.md
  - Architecture: architecture.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
